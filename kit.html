 portadocumenti","items":["Metti l’esterno sull’interno, dritto contro dritto. Cuci il perimetro lasciando un’apertura."],"op":["line","none"]},{"e":"Rivoltare","t":"Rivolta e finisci","items":["Rivolta, stira, impuntura il contorno, segna la piega centrale e cuci il bottone dove arriva l’asola senza tensione."],"op":["straight","none"]}]}},"legend":true},"ruffle":{"badge":"KIT 03","hours":4,"imgs":[1,2,3,4,5,6],"L":{"ca":{"title":"Bossa amb volant","materials":[["Nanses","2 tires · 65 × 8 cm + 2 tires d’entretela · 65 cm"],["Tancament","1 tira · aprox. 12 × 4 cm + 1 botó"],["Volant","1,70 m de tela · 10 cm d’ample"],["Exterior","2 × 30 × 42 cm · 2 × 6 × 42 cm · 1 × 108 × 17 cm · 2 × 6 × 17 cm"],["Folre","1 × 17 × 108 cm · 2 × 36 × 42 cm"],["Butxaca","2 × 26 × 42 cm · cremallera 45 cm · cinturilla 45 cm"],["Foam / estabilitzador","2 × 36 × 42 cm · 1 × 17 × 100 cm"]],"steps":[{"t":"Nanses i tancament","items":["Planxa l’entretela sobre les tires de 8 × 65 cm.","Doblega les tires seguint les marques de l’entretela, amagant els marges a l’interior.","Fes un repunt a cada costat llarg de la nansa.","Prepara la tira de tancament com un biaix i repunta el costat obert."],"cap":"Pàgina 1 · nanses i tira de tancament"},{"t":"Volant","items":["Uneix les tires fins formar un cercle, cara bonica amb cara bonica.","Doblega el cercle per la meitat fins obtenir una banda d’uns 5 cm.","Cus pel costat obert a 1 cm aproximadament.","Posa la tensió a 0 i fil elàstic a la canilla perquè el volant s’arrugui."],"cap":"Pàgina 2 · muntatge del volant"},{"t":"Butxaca amb cremallera","items":["Prepara les peces de 26 × 42 cm, la cremallera, la cinturilla i una peça interior de 36 × 42 cm.","Fes el sandvitx de teles i cremallera i cus amb la pota de cremallera.","Fes un repunt de càrrega molt a prop de la cremallera.","Col·loca la butxaca sobre la peça interior i fixa la cinturilla a la part superior."],"cap":"Pàgina 3 · butxaca"},{"t":"Interior de la bossa","items":["Fixa les peces al foam amb zig-zag als laterals.","Cus el contorn de la peça de 36 × 42 cm amb la peça de 17 × 108 cm.","Afegeix l’altre costat de la bossa.","Deixa una obertura d’uns 10 cm en un lateral per poder girar la bossa."],"cap":"Pàgina 4 · interior"},{"t":"Exterior i volant","items":["Munta l’exterior igual que l’interior, començant per la peça de 17 cm.","Uneix les peces de 6 cm entre elles i remata amb zig-zag.","Reparteix el volant per tota la part superior i fixa’l amb zig-zag.","Col·loca el cercle de 6 cm sobre el volant, fent coincidir les costures, i cus tot el contorn."],"cap":"Pàgina 5 · exterior"},{"t":"Muntatge final","items":["Centra les nanses: marca el centre i situa cada extrem a 6 cm del centre.","Col·loca la tira de tancament al costat de la butxaca.","Posa bossa exterior i interior cara bonica amb cara bonica i cus tot el contorn superior.","Gira pel forat, tanca’l amb punt ocult, fes un repunt superior i cus el botó."],"cap":"Pàgina 6 · muntatge final"}]},"es":{"title":"Bolso con volante","materials":[["Asas","2 tiras · 65 × 8 cm + 2 tiras de entretela · 65 cm"],["Cierre","1 tira · aprox. 12 × 4 cm + 1 botón"],["Volante","1,70 m de tela · 10 cm de ancho"],["Exterior","2 × 30 × 42 cm · 2 × 6 × 42 cm · 1 × 108 × 17 cm · 2 × 6 × 17 cm"],["Forro","1 × 17 × 108 cm · 2 × 36 × 42 cm"],["Bolsillo","2 × 26 × 42 cm · cremallera 45 cm · pretina 45 cm"],["Foam / estabilizador","2 × 36 × 42 cm · 1 × 17 × 100 cm"]],"steps":[{"t":"Asas y cierre","items":["Plancha la entretela sobre las tiras de 8 × 65 cm.","Dobla las tiras siguiendo las marcas de la entretela, escondiendo los márgenes dentro.","Haz un pespunte en cada lado largo del asa.","Prepara la tira de cierre como un bies y pespuntea el lado abierto."],"cap":"Página 1 · asas y tira de cierre"},{"t":"Volante","items":["Une las tiras hasta formar un círculo, derecho con derecho.","Dobla el círculo por la mitad hasta obtener una banda de unos 5 cm.","Cose por el lado abierto a 1 cm aproximadamente.","Pon la tensión a 0 e hilo elástico en la canilla para que el volante se frunza."],"cap":"Página 2 · montaje del volante"},{"t":"Bolsillo con cremallera","items":["Prepara las piezas de 26 × 42 cm, la cremallera, la pretina y una pieza interior de 36 × 42 cm.","Haz el sándwich de telas y cremallera y cose con el prensatelas de cremallera.","Haz un pespunte de carga muy cerca de la cremallera.","Coloca el bolsillo sobre la pieza interior y fija la pretina en la parte superior."],"cap":"Página 3 · bolsillo"},{"t":"Interior del bolso","items":["Fija las piezas al foam con zigzag en los laterales.","Cose el contorno de la pieza de 36 × 42 cm con la pieza de 17 × 108 cm.","Añade el otro lado del bolso.","Deja una abertura de unos 10 cm en un lateral para poder girar el bolso."],"cap":"Página 4 · interior"},{"t":"Exterior y volante","items":["Monta el exterior igual que el interior, empezando por la pieza de 17 cm.","Une las piezas de 6 cm entre sí y remata con zigzag.","Reparte el volante por toda la parte superior y fíjalo con zigzag.","Coloca el círculo de 6 cm sobre el volante, haciendo coincidir las costuras, y cose todo el contorno."],"cap":"Página 5 · exterior"},{"t":"Montaje final","items":["Centra las asas: marca el centro y sitúa cada extremo a 6 cm del centro.","Coloca la tira de cierre junto al bolsillo.","Pon bolso exterior e interior derecho con derecho y cose todo el contorno superior.","Gira por el hueco, ciérralo con punto invisible, haz un pespunte superior y cose el botón."],"cap":"Página 6 · montaje final"}]},"en":{"title":"Ruffle bag","materials":[["Handles","2 strips · 65 × 8 cm + 2 strips of interfacing · 65 cm"],["Closure","1 strip · approx. 12 × 4 cm + 1 button"],["Ruffle","1.70 m of fabric · 10 cm wide"],["Outer","2 × 30 × 42 cm · 2 × 6 × 42 cm · 1 × 108 × 17 cm · 2 × 6 × 17 cm"],["Lining","1 × 17 × 108 cm · 2 × 36 × 42 cm"],["Pocket","2 × 26 × 42 cm · zip 45 cm · waistband tape 45 cm"],["Foam / stabiliser","2 × 36 × 42 cm · 1 × 17 × 100 cm"]],"steps":[{"t":"Handles and closure","items":["Iron the interfacing onto the 8 × 65 cm strips.","Fold the strips along the interfacing marks, hiding the allowances inside.","Topstitch each long side of the handle.","Prepare the closure strip like binding and topstitch the open side."],"cap":"Page 1 · handles and closure strip"},{"t":"Ruffle","items":["Join the strips into a ring, right sides together.","Fold the ring in half to get a band about 5 cm wide.","Sew along the open edge at about 1 cm.","Set tension to 0 with elastic thread in the bobbin so the ruffle gathers."],"cap":"Page 2 · ruffle assembly"},{"t":"Zip pocket","items":["Prepare the 26 × 42 cm pieces, the zip, the tape and one 36 × 42 cm lining piece.","Make the fabric-and-zip sandwich and sew with the zipper foot.","Topstitch very close to the zip.","Place the pocket on the lining piece and fix the tape along the top."],"cap":"Page 3 · pocket"},{"t":"Bag lining","items":["Fix the pieces to the foam with a zigzag along the sides.","Sew the outline of the 36 × 42 cm piece to the 17 × 108 cm piece.","Add the other side of the bag.","Leave an opening of about 10 cm in one side to turn the bag."],"cap":"Page 4 · lining"},{"t":"Outer and ruffle","items":["Assemble the outer like the lining, starting with the 17 cm piece.","Join the 6 cm pieces to each other and finish with a zigzag.","Spread the ruffle all along the top and fix it with a zigzag.","Place the 6 cm ring over the ruffle, matching the seams, and sew all around."],"cap":"Page 5 · outer"},{"t":"Final assembly","items":["Centre the handles: mark the centre and place each end 6 cm from it.","Place the closure strip next to the pocket.","Put outer and lining bags right sides together and sew all around the top.","Turn through the gap, close it with a slip stitch, topstitch the top and sew on the button."],"cap":"Page 6 · final assembly"}]},"de":{"title":"Tasche mit Rüsche","materials":[["Henkel","2 Streifen · 65 × 8 cm + 2 Streifen Einlage · 65 cm"],["Verschluss","1 Streifen · ca. 12 × 4 cm + 1 Knopf"],["Rüsche","1,70 m Stoff · 10 cm breit"],["Aussenstoff","2 × 30 × 42 cm · 2 × 6 × 42 cm · 1 × 108 × 17 cm · 2 × 6 × 17 cm"],["Futter","1 × 17 × 108 cm · 2 × 36 × 42 cm"],["Tasche","2 × 26 × 42 cm · Reissverschluss 45 cm · Bundband 45 cm"],["Foam / Stabilisator","2 × 36 × 42 cm · 1 × 17 × 100 cm"]],"steps":[{"t":"Henkel und Verschluss","items":["Die Einlage auf die Streifen 8 × 65 cm bügeln.","Die Streifen entlang der Einlagemarkierungen falten, die Zugaben nach innen.","Jede lange Seite des Henkels absteppen.","Den Verschlussstreifen wie ein Einfassband vorbereiten und die offene Seite absteppen."],"cap":"Seite 1 · Henkel und Verschlussstreifen"},{"t":"Rüsche","items":["Die Streifen rechts auf rechts zu einem Ring zusammennähen.","Den Ring zur Hälfte falten, sodass ein etwa 5 cm breites Band entsteht.","An der offenen Kante bei etwa 1 cm nähen.","Fadenspannung auf 0 und Gummifaden in die Spule, damit sich die Rüsche kräuselt."],"cap":"Seite 2 · Rüsche"},{"t":"Reissverschlusstasche","items":["Die Teile 26 × 42 cm, den Reissverschluss, das Band und ein Futterteil 36 × 42 cm bereitlegen.","Das Sandwich aus Stoffen und Reissverschluss bilden und mit dem Reissverschlussfuss nähen.","Ganz nah am Reissverschluss absteppen.","Die Tasche auf das Futterteil legen und das Band an der Oberkante fixieren."],"cap":"Seite 3 · Tasche"},{"t":"Innentasche","items":["Die Teile mit Zickzack an den Seiten auf dem Foam fixieren.","Den Umriss des Teils 36 × 42 cm mit dem Teil 17 × 108 cm zusammennähen.","Die andere Seite der Tasche ansetzen.","An einer Seite eine Wendeöffnung von etwa 10 cm lassen."],"cap":"Seite 4 · Innen"},{"t":"Aussen und Rüsche","items":["Das Aussenteil wie das Innenteil zusammensetzen, mit dem 17-cm-Teil beginnen.","Die 6-cm-Teile miteinander verbinden und mit Zickzack versäubern.","Die Rüsche über die ganze Oberkante verteilen und mit Zickzack fixieren.","Den 6-cm-Ring auf die Rüsche legen, Nähte aufeinander, und rundum nähen."],"cap":"Seite 5 · Aussen"},{"t":"Endmontage","items":["Henkel zentrieren: Mitte markieren und jedes Ende 6 cm davon entfernt setzen.","Den Verschlussstreifen neben der Tasche platzieren.","Aussen- und Innentasche rechts auf rechts legen und die Oberkante rundum nähen.","Durch die Öffnung wenden, mit Matratzenstich schliessen, Oberkante absteppen und den Knopf annähen."],"cap":"Seite 6 · Endmontage"}]},"fr":{"title":"Sac à volant","materials":[["Anses","2 bandes · 65 × 8 cm + 2 bandes d’entoilage · 65 cm"],["Fermeture","1 bande · env. 12 × 4 cm + 1 bouton"],["Volant","1,70 m de tissu · 10 cm de large"],["Extérieur","2 × 30 × 42 cm · 2 × 6 × 42 cm · 1 × 108 × 17 cm · 2 × 6 × 17 cm"],["Doublure","1 × 17 × 108 cm · 2 × 36 × 42 cm"],["Poche","2 × 26 × 42 cm · fermeture 45 cm · ruban 45 cm"],["Mousse / stabilisateur","2 × 36 × 42 cm · 1 × 17 × 100 cm"]],"steps":[{"t":"Anses et fermeture","items":["Thermocolle l’entoilage sur les bandes de 8 × 65 cm.","Plie les bandes en suivant les repères de l’entoilage, marges cachées à l’intérieur.","Surpique chaque grand côté de l’anse.","Prépare la bande de fermeture comme un biais et surpique le côté ouvert."],"cap":"Page 1 · anses et bande de fermeture"},{"t":"Volant","items":["Assemble les bandes en cercle, endroit contre endroit.","Plie le cercle en deux pour obtenir une bande d’environ 5 cm.","Couds le long du bord ouvert à environ 1 cm.","Tension à 0 et fil élastique dans la canette pour que le volant se fronce."],"cap":"Page 2 · montage du volant"},{"t":"Poche zippée","items":["Prépare les pièces de 26 × 42 cm, la fermeture, le ruban et une pièce de doublure de 36 × 42 cm.","Fais le sandwich tissus + fermeture et couds au pied fermeture.","Surpique très près de la fermeture.","Place la poche sur la pièce de doublure et fixe le ruban en haut."],"cap":"Page 3 · poche"},{"t":"Intérieur du sac","items":["Fixe les pièces sur la mousse au zigzag sur les côtés.","Couds le contour de la pièce de 36 × 42 cm avec la pièce de 17 × 108 cm.","Ajoute l’autre côté du sac.","Laisse une ouverture d’environ 10 cm sur un côté pour retourner le sac."],"cap":"Page 4 · intérieur"},{"t":"Extérieur et volant","items":["Monte l’extérieur comme l’intérieur, en commençant par la pièce de 17 cm.","Assemble les pièces de 6 cm entre elles et surfile au zigzag.","Répartis le volant sur tout le haut et fixe-le au zigzag.","Place le cercle de 6 cm sur le volant, coutures alignées, et couds tout le tour."],"cap":"Page 5 · extérieur"},{"t":"Montage final","items":["Centre les anses : marque le centre et place chaque extrémité à 6 cm.","Place la bande de fermeture à côté de la poche.","Mets sac extérieur et intérieur endroit contre endroit et couds tout le tour du haut.","Retourne par l’ouverture, referme au point invisible, surpique le haut et couds le bouton."],"cap":"Page 6 · montage final"}]},"it":{"title":"Borsa con balza","materials":[["Manici","2 strisce · 65 × 8 cm + 2 strisce di interfodera · 65 cm"],["Chiusura","1 striscia · circa 12 × 4 cm + 1 bottone"],["Balza","1,70 m di tessuto · 10 cm di altezza"],["Esterno","2 × 30 × 42 cm · 2 × 6 × 42 cm · 1 × 108 × 17 cm · 2 × 6 × 17 cm"],["Fodera","1 × 17 × 108 cm · 2 × 36 × 42 cm"],["Tasca","2 × 26 × 42 cm · cerniera 45 cm · nastro 45 cm"],["Foam / stabilizzatore","2 × 36 × 42 cm · 1 × 17 × 100 cm"]],"steps":[{"t":"Manici e chiusura","items":["Stira l’interfodera sulle strisce da 8 × 65 cm.","Piega le strisce seguendo i segni dell’interfodera, nascondendo i margini all’interno.","Fai un’impuntura su ogni lato lungo del manico.","Prepara la striscia di chiusura come uno sbieco e impuntura il lato aperto."],"cap":"Pagina 1 · manici e striscia di chiusura"},{"t":"Balza","items":["Unisci le strisce fino a formare un anello, dritto contro dritto.","Piega l’anello a metà fino a ottenere una fascia di circa 5 cm.","Cuci lungo il lato aperto a circa 1 cm.","Metti la tensione a 0 e filo elastico nella spolina perché la balza si arricci."],"cap":"Pagina 2 · montaggio della balza"},{"t":"Tasca con cerniera","items":["Prepara i pezzi da 26 × 42 cm, la cerniera, il nastro e un pezzo di fodera da 36 × 42 cm.","Fai il sandwich di tessuti e cerniera e cuci con il piedino per cerniere.","Fai un’impuntura molto vicina alla cerniera.","Posiziona la tasca sul pezzo di fodera e fissa il nastro sul bordo superiore."],"cap":"Pagina 3 · tasca"},{"t":"Interno della borsa","items":["Fissa i pezzi al foam con zigzag sui lati.","Cuci il contorno del pezzo 36 × 42 cm con il pezzo 17 × 108 cm.","Aggiungi l’altro lato della borsa.","Lascia un’apertura di circa 10 cm su un lato per rivoltare la borsa."],"cap":"Pagina 4 · interno"},{"t":"Esterno e balza","items":["Monta l’esterno come l’interno, iniziando dal pezzo da 17 cm.","Unisci i pezzi da 6 cm tra loro e rifinisci con zigzag.","Distribuisci la balza su tutto il bordo superiore e fissala con zigzag.","Posiziona l’anello da 6 cm sopra la balza, facendo combaciare le cuciture, e cuci tutto il contorno."],"cap":"Pagina 5 · esterno"},{"t":"Montaggio finale","items":["Centra i manici: segna il centro e posiziona ogni estremità a 6 cm dal centro.","Posiziona la striscia di chiusura accanto alla tasca.","Metti borsa esterna e interna dritto contro dritto e cuci tutto il bordo superiore.","Rivolta dall’apertura, chiudila con punto invisibile, fai un’impuntura sul bordo e cuci il bottone."],"cap":"Pagina 6 · montaggio finale"}]}}},"shoebag":{"badge":"KIT 04b","hours":2,"imgs":[1,2,3],"L":{"ca":{"title":"Bossa de sabates","materials":[["Exterior","2 × 18 × 40 cm · 1 × 36 × 40 cm"],["Interior","2 × 18 × 40 cm · 1 × 36 × 40 cm (impermeable)"],["Cremallera","1 unitat · 45 cm"],["Biaix","2 peces · 20 × 4 cm"],["Cinta de motxilla","12 cm"]],"steps":[{"t":"Muntem la cremallera","items":["Col·loca una peça interior de 18 × 40 cm amb la cara bonica amunt.","Alinea la cremallera al costat de 40 cm i posa a sobre la peça exterior, cara bonica cap avall.","Cus amb pota de cremallera, gira les teles i fes un repunt de càrrega.","Repeteix el mateix a l’altre costat de la cremallera."],"cap":"Pàgina 1 · cremallera"},{"t":"Cosim les teles del darrere","items":["Posa la peça amb cremallera sobre la peça interior de 36 × 40 cm, cara bonica amb cara bonica.","A sobre col·loca la peça exterior de 36 × 40 cm, amb les cares boniques encarades.","Cus els dos laterals de 40 cm i remata amb zig-zag.","Gira i centra la cremallera; retalla el sobrant si cal."],"cap":"Pàgina 2 · cos principal"},{"t":"Tanquem i rematem","items":["Centra la cremallera i marca 5 cm de plec a cada lateral.","Fixa els plecs amb agulles i cus el lateral passant per sobre de la cremallera.","Afegeix la tira de 4 cm al marge per fer l’acabat tipus biaix.","Repeteix a l’altre costat, gira la bossa i comprova que els acabats quedin nets."],"cap":"Pàgina 3 · tancament"}]},"es":{"title":"Bolsa de zapatos","materials":[["Exterior","2 × 18 × 40 cm · 1 × 36 × 40 cm"],["Interior","2 × 18 × 40 cm · 1 × 36 × 40 cm (impermeable)"],["Cremallera","1 unidad · 45 cm"],["Bies","2 piezas · 20 × 4 cm"],["Cinta de mochila","12 cm"]],"steps":[{"t":"Montamos la cremallera","items":["Coloca una pieza interior de 18 × 40 cm con el derecho hacia arriba.","Alinea la cremallera en el lado de 40 cm y pon encima la pieza exterior, derecho hacia abajo.","Cose con prensatelas de cremallera, gira las telas y haz un pespunte de carga.","Repite lo mismo al otro lado de la cremallera."],"cap":"Página 1 · cremallera"},{"t":"Cosemos las telas de atrás","items":["Pon la pieza con cremallera sobre la pieza interior de 36 × 40 cm, derecho con derecho.","Encima coloca la pieza exterior de 36 × 40 cm, con los derechos enfrentados.","Cose los dos laterales de 40 cm y remata con zigzag.","Gira y centra la cremallera; recorta el sobrante si hace falta."],"cap":"Página 2 · cuerpo principal"},{"t":"Cerramos y rematamos","items":["Centra la cremallera y marca 5 cm de pliegue en cada lateral.","Fija los pliegues con alfileres y cose el lateral pasando por encima de la cremallera.","Añade la tira de 4 cm al margen para el acabado tipo bies.","Repite al otro lado, gira la bolsa y comprueba que los acabados queden limpios."],"cap":"Página 3 · cierre"}]},"en":{"title":"Shoe bag","materials":[["Outer","2 × 18 × 40 cm · 1 × 36 × 40 cm"],["Lining","2 × 18 × 40 cm · 1 × 36 × 40 cm (waterproof)"],["Zip","1 · 45 cm"],["Binding","2 pieces · 20 × 4 cm"],["Webbing","12 cm"]],"steps":[{"t":"Fit the zip","items":["Place one 18 × 40 cm lining piece right side up.","Align the zip along the 40 cm edge and put the outer piece on top, right side down.","Sew with the zipper foot, turn the fabrics and topstitch.","Repeat on the other side of the zip."],"cap":"Page 1 · zip"},{"t":"Sew the back fabrics","items":["Put the zip piece on the 36 × 40 cm lining piece, right sides together.","On top, place the 36 × 40 cm outer piece, right sides facing.","Sew the two 40 cm sides and finish with a zigzag.","Turn and centre the zip; trim the excess if needed."],"cap":"Page 2 · main body"},{"t":"Close and finish","items":["Centre the zip and mark a 5 cm fold on each side.","Pin the folds and sew the side, passing over the zip.","Add the 4 cm strip to the allowance for a bound finish.","Repeat on the other side, turn the bag and check the finishes are clean."],"cap":"Page 3 · closing"}]},"de":{"title":"Schuhbeutel","materials":[["Aussenstoff","2 × 18 × 40 cm · 1 × 36 × 40 cm"],["Futter","2 × 18 × 40 cm · 1 × 36 × 40 cm (wasserdicht)"],["Reissverschluss","1 Stück · 45 cm"],["Einfassband","2 Teile · 20 × 4 cm"],["Gurtband","12 cm"]],"steps":[{"t":"Reissverschluss einsetzen","items":["Ein Futterteil 18 × 40 cm mit der rechten Seite nach oben legen.","Den Reissverschluss an der 40-cm-Kante ausrichten und das Aussenteil mit der rechten Seite nach unten darauflegen.","Mit dem Reissverschlussfuss nähen, die Stoffe umklappen und absteppen.","Dasselbe auf der anderen Seite des Reissverschlusses wiederholen."],"cap":"Seite 1 · Reissverschluss"},{"t":"Rückseiten nähen","items":["Das Teil mit Reissverschluss rechts auf rechts auf das Futterteil 36 × 40 cm legen.","Darauf das Aussenteil 36 × 40 cm legen, rechte Seiten aufeinander.","Die beiden 40-cm-Seiten nähen und mit Zickzack versäubern.","Wenden und den Reissverschluss zentrieren; Überstand bei Bedarf abschneiden."],"cap":"Seite 2 · Hauptteil"},{"t":"Schliessen und versäubern","items":["Den Reissverschluss zentrieren und an jeder Seite 5 cm Falte anzeichnen.","Die Falten stecken und die Seite über den Reissverschluss hinweg nähen.","Den 4-cm-Streifen an die Nahtzugabe setzen und als Einfassung verarbeiten.","Auf der anderen Seite wiederholen, wenden und prüfen, dass die Kanten sauber sind."],"cap":"Seite 3 · Schliessen"}]},"fr":{"title":"Sac à chaussures","materials":[["Extérieur","2 × 18 × 40 cm · 1 × 36 × 40 cm"],["Doublure","2 × 18 × 40 cm · 1 × 36 × 40 cm (imperméable)"],["Fermeture à glissière","1 · 45 cm"],["Biais","2 pièces · 20 × 4 cm"],["Sangle","12 cm"]],"steps":[{"t":"Poser la fermeture","items":["Pose une pièce de doublure de 18 × 40 cm endroit vers le haut.","Aligne la fermeture sur le côté de 40 cm et pose la pièce extérieure par-dessus, endroit vers le bas.","Couds au pied fermeture, retourne les tissus et surpique.","Répète de l’autre côté de la fermeture."],"cap":"Page 1 · fermeture"},{"t":"Coudre les tissus du dos","items":["Pose la pièce avec fermeture sur la pièce de doublure de 36 × 40 cm, endroit contre endroit.","Par-dessus, place la pièce extérieure de 36 × 40 cm, endroits face à face.","Couds les deux côtés de 40 cm et surfile au zigzag.","Retourne et centre la fermeture ; recoupe l’excédent si besoin."],"cap":"Page 2 · corps principal"},{"t":"Fermer et finir","items":["Centre la fermeture et marque un pli de 5 cm de chaque côté.","Épingle les plis et couds le côté en passant sur la fermeture.","Ajoute la bande de 4 cm sur la marge pour une finition en biais.","Répète de l’autre côté, retourne le sac et vérifie que les finitions sont nettes."],"cap":"Page 3 · fermeture"}]},"it":{"title":"Sacca per scarpe","materials":[["Esterno","2 × 18 × 40 cm · 1 × 36 × 40 cm"],["Fodera","2 × 18 × 40 cm · 1 × 36 × 40 cm (impermeabile)"],["Cerniera","1 · 45 cm"],["Sbieco","2 pezzi · 20 × 4 cm"],["Fettuccia","12 cm"]],"steps":[{"t":"Montiamo la cerniera","items":["Posiziona un pezzo di fodera 18 × 40 cm con il dritto verso l’alto.","Allinea la cerniera al lato di 40 cm e metti sopra il pezzo esterno, dritto verso il basso.","Cuci con il piedino per cerniere, rivolta i tessuti e fai un’impuntura.","Ripeti sull’altro lato della cerniera."],"cap":"Pagina 1 · cerniera"},{"t":"Cuciamo i tessuti del retro","items":["Metti il pezzo con la cerniera sul pezzo di fodera 36 × 40 cm, dritto contro dritto.","Sopra posiziona il pezzo esterno 36 × 40 cm, con i dritti affrontati.","Cuci i due lati da 40 cm e rifinisci con zigzag.","Rivolta e centra la cerniera; rifila l’eccesso se serve."],"cap":"Pagina 2 · corpo principale"},{"t":"Chiudiamo e rifiniamo","items":["Centra la cerniera e segna 5 cm di piega su ogni lato.","Ferma le pieghe con gli spilli e cuci il lato passando sopra la cerniera.","Aggiungi la striscia da 4 cm al margine per la rifinitura a sbieco.","Ripeti sull’altro lato, rivolta la sacca e controlla che le rifiniture siano pulite."],"cap":"Pagina 3 · chiusura"}]}}},"shopper":{"badge":"KIT 13","hours":2.5,"imgs":[null,null,null,null,null,null,null],"defaults":"ws","src":["Sewspiratrice","https://sewspiratrice.com/diy-foldable-shopping-tote-bag-free-pattern/"],"L":{"ca":{"title":"Bossa de la compra plegable","materials":[["Tela","aprox. 1 m"],["Patró","PDF gratuït de la font"],["Butxaca","1 peça segons patró"],["Cos","Peces segons patró"],["Nanses","Integrades al patró"],["Tancament","Sense peces metàl·liques"]],"steps":[{"e":"Tallar","t":"Talla les peces","items":["Imprimeix el patró al 100% i talla totes les peces transferint les marques i piquets."]},{"e":"Butxaca","t":"Prepara la butxaca","items":["Doblega la secció curta de la butxaca sobre la llarga, revés amb revés, i marca el plec amb la planxa."]},{"e":"Vora","t":"Acaba la vora","items":["Doblega la vora superior curta 1 cm dues vegades i fes un repunt per formar un acabat net."]},{"e":"Plegat","t":"Forma la butxaca de plegat","items":["Torna a plegar la butxaca sobre la marca inicial i cus segons les marques del patró."]},{"e":"Cos","t":"Munta el cos de la bossa","items":["Uneix les peces principals, cosint laterals i base segons el tutorial. Remata els marges."]},{"e":"Nanses","t":"Acaba les nanses","items":["Planxa i cus els marges de les nanses perquè quedin nets i resistents."]},{"e":"Plegar","t":"Plega dins la butxaca","items":["Un cop acabada, gira i plega la bossa dins de la butxaca integrada."]}]},"es":{"title":"Bolsa de la compra plegable","materials":[["Tela","aprox. 1 m"],["Patrón","PDF gratuito de la fuente"],["Bolsillo","1 pieza según patrón"],["Cuerpo","Piezas según patrón"],["Asas","Integradas en el patrón"],["Cierre","Sin piezas metálicas"]],"steps":[{"e":"Cortar","t":"Corta las piezas","items":["Imprime el patrón al 100 % y corta todas las piezas transfiriendo marcas y piquetes."]},{"e":"Bolsillo","t":"Prepara el bolsillo","items":["Dobla la sección corta del bolsillo sobre la larga, revés con revés, y marca el pliegue con la plancha."]},{"e":"Dobladillo","t":"Acaba el borde","items":["Dobla el borde superior corto 1 cm dos veces y haz un pespunte para un acabado limpio."]},{"e":"Plegado","t":"Forma el bolsillo de plegado","items":["Vuelve a plegar el bolsillo sobre la marca inicial y cose según las marcas del patrón."]},{"e":"Cuerpo","t":"Monta el cuerpo de la bolsa","items":["Une las piezas principales, cosiendo laterales y base según el tutorial. Remata los márgenes."]},{"e":"Asas","t":"Acaba las asas","items":["Plancha y cose los márgenes de las asas para que queden limpias y resistentes."]},{"e":"Plegar","t":"Pliega dentro del bolsillo","items":["Una vez acabada, gira y pliega la bolsa dentro del bolsillo integrado."]}]},"en":{"title":"Foldable shopping bag","materials":[["Fabric","approx. 1 m"],["Pattern","Free PDF from the source"],["Pocket","1 piece as per pattern"],["Body","Pieces as per pattern"],["Handles","Built into the pattern"],["Closure","No hardware"]],"steps":[{"e":"Cut","t":"Cut the pieces","items":["Print the pattern at 100% and cut all the pieces, transferring marks and notches."]},{"e":"Pocket","t":"Prepare the pocket","items":["Fold the short section of the pocket over the long one, wrong sides together, and press the fold."]},{"e":"Hem","t":"Finish the edge","items":["Fold the short top edge 1 cm twice and topstitch for a clean finish."]},{"e":"Fold","t":"Form the folding pocket","items":["Fold the pocket again on the first crease and sew following the pattern marks."]},{"e":"Body","t":"Assemble the bag body","items":["Join the main pieces, sewing sides and base as in the tutorial. Finish the allowances."]},{"e":"Handles","t":"Finish the handles","items":["Press and sew the handle allowances so they are neat and strong."]},{"e":"Fold","t":"Fold into the pocket","items":["Once finished, turn and fold the bag into its built-in pocket."]}]},"de":{"title":"Faltbarer Einkaufsbeutel","materials":[["Stoff","ca. 1 m"],["Schnitt","Gratis-PDF der Quelle"],["Tasche","1 Teil nach Schnitt"],["Körper","Teile nach Schnitt"],["Henkel","Im Schnitt integriert"],["Verschluss","Ohne Metallteile"]],"steps":[{"e":"Zuschneiden","t":"Teile zuschneiden","items":["Schnitt bei 100 % drucken und alle Teile zuschneiden, Markierungen und Knipse übertragen."]},{"e":"Tasche","t":"Tasche vorbereiten","items":["Den kurzen Taschenteil links auf links über den langen falten und die Kante bügeln."]},{"e":"Saum","t":"Kante fertigstellen","items":["Die kurze Oberkante zweimal 1 cm umschlagen und absteppen."]},{"e":"Falten","t":"Falttasche formen","items":["Die Tasche wieder an der ersten Kante falten und nach den Schnittmarkierungen nähen."]},{"e":"Körper","t":"Beutelkörper zusammensetzen","items":["Hauptteile verbinden, Seiten und Boden wie in der Anleitung nähen. Nahtzugaben versäubern."]},{"e":"Henkel","t":"Henkel fertigstellen","items":["Nahtzugaben der Henkel bügeln und nähen, damit sie sauber und stabil sind."]},{"e":"Falten","t":"In die Tasche falten","items":["Zum Schluss den Beutel wenden und in die integrierte Tasche falten."]}]},"fr":{"title":"Sac à provisions pliable","materials":[["Tissu","env. 1 m"],["Patron","PDF gratuit de la source"],["Poche","1 pièce selon patron"],["Corps","Pièces selon patron"],["Anses","Intégrées au patron"],["Fermeture","Sans pièces métalliques"]],"steps":[{"e":"Couper","t":"Coupe les pièces","items":["Imprime le patron à 100 % et coupe toutes les pièces en reportant repères et crans."]},{"e":"Poche","t":"Prépare la poche","items":["Plie la section courte de la poche sur la longue, envers contre envers, et marque le pli au fer."]},{"e":"Ourlet","t":"Finis le bord","items":["Plie le bord supérieur court deux fois de 1 cm et surpique pour une finition nette."]},{"e":"Pliage","t":"Forme la poche de pliage","items":["Replie la poche sur le premier pli et couds selon les repères du patron."]},{"e":"Corps","t":"Monte le corps du sac","items":["Assemble les pièces principales, côtés et fond selon le tutoriel. Surfile les marges."]},{"e":"Anses","t":"Finis les anses","items":["Repasse et couds les marges des anses pour qu’elles soient nettes et solides."]},{"e":"Plier","t":"Plie dans la poche","items":["Une fois terminé, retourne et plie le sac dans sa poche intégrée."]}]},"it":{"title":"Borsa della spesa pieghevole","materials":[["Tessuto","circa 1 m"],["Cartamodello","PDF gratuito della fonte"],["Tasca","1 pezzo secondo cartamodello"],["Corpo","Pezzi secondo cartamodello"],["Manici","Integrati nel cartamodello"],["Chiusura","Senza parti metalliche"]],"steps":[{"e":"Tagliare","t":"Taglia i pezzi","items":["Stampa il cartamodello al 100% e taglia tutti i pezzi riportando segni e tacche."]},{"e":"Tasca","t":"Prepara la tasca","items":["Piega la sezione corta della tasca sulla lunga, rovescio contro rovescio, e segna la piega con il ferro."]},{"e":"Orlo","t":"Rifinisci il bordo","items":["Piega il bordo superiore corto di 1 cm due volte e fai un’impuntura per una finitura pulita."]},{"e":"Piega","t":"Forma la tasca di ripiegatura","items":["Ripiega la tasca sulla prima piega e cuci seguendo i segni del cartamodello."]},{"e":"Corpo","t":"Monta il corpo della borsa","items":["Unisci i pezzi principali cucendo lati e base come nel tutorial. Rifinisci i margini."]},{"e":"Manici","t":"Rifinisci i manici","items":["Stira e cuci i margini dei manici perché siano puliti e resistenti."]},{"e":"Piegare","t":"Ripiega nella tasca","items":["Una volta finita, rivolta e ripiega la borsa nella tasca integrata."]}]}}},"strawberry":{"badge":"KIT 05","hours":1.5,"imgs":[1,2,3],"L":{"ca":{"title":"Bossa maduixa / bossa per mudes","materials":[["Cos de la bossa","2 peces · 65 × 55 cm"],["Peça maduixa","1 peça · 17 × 17 cm"],["Tires","2 tires · 6 × 16 cm"],["Cordonet","50 cm"],["Fre","1 unitat"]],"steps":[{"t":"Calquem el patró","items":["Posa les dues teles encarades.","Calca el patró al revés de la tela.","Retalla les dues capes seguint la línia del patró."],"cap":"Pàgina 1 · patró"},{"t":"Fem la maduixeta","items":["Fes un doble plec als extrems de les tires de 6 cm i fixa’l amb un repunt.","Doblega les tires per la meitat al llarg, cara bonica a fora, i fixa amb zig-zag.","Fes un plec d’1 cm al costat llarg dels triangles.","Col·loca triangle i tira a una punta inferior de cada cos, mirant que coincideixin quan encaris les dues teles."],"cap":"Pàgina 1 · maduixeta"},{"t":"Cosim la bossa","items":["Encara les dues teles, cara bonica amb cara bonica.","Cus laterals i nanses amb repunt i zig-zag.","Col·loca el biaix al voltant de les nanses en dos passos: primer pel revés i després per la cara bonica.","Passa el cordonet per les tires amb una agulla imperdible i afegeix el fre."],"cap":"Pàgina 2 · muntatge final"}]},"es":{"title":"Bolsa fresa / bolsa para mudas","materials":[["Cuerpo de la bolsa","2 piezas · 65 × 55 cm"],["Pieza fresa","1 pieza · 17 × 17 cm"],["Tiras","2 tiras · 6 × 16 cm"],["Cordón","50 cm"],["Tope","1 unidad"]],"steps":[{"t":"Calcamos el patrón","items":["Enfrenta las dos telas.","Calca el patrón en el revés de la tela.","Recorta las dos capas siguiendo la línea del patrón."],"cap":"Página 1 · patrón"},{"t":"Hacemos la fresita","items":["Haz un doble pliegue en los extremos de las tiras de 6 cm y fíjalo con un pespunte.","Dobla las tiras por la mitad a lo largo, derecho hacia fuera, y fija con zigzag.","Haz un pliegue de 1 cm en el lado largo de los triángulos.","Coloca triángulo y tira en una punta inferior de cada cuerpo, comprobando que coincidan al enfrentar las dos telas."],"cap":"Página 1 · fresita"},{"t":"Cosemos la bolsa","items":["Enfrenta las dos telas, derecho con derecho.","Cose laterales y asas con pespunte y zigzag.","Coloca el bies alrededor de las asas en dos pasos: primero por el revés y después por el derecho.","Pasa el cordón por las tiras con un imperdible y añade el tope."],"cap":"Página 2 · montaje final"}]},"en":{"title":"Strawberry bag / spare-clothes bag","materials":[["Bag body","2 pieces · 65 × 55 cm"],["Strawberry piece","1 piece · 17 × 17 cm"],["Strips","2 strips · 6 × 16 cm"],["Cord","50 cm"],["Cord stopper","1"]],"steps":[{"t":"Trace the pattern","items":["Put the two fabrics facing each other.","Trace the pattern on the wrong side of the fabric.","Cut both layers following the pattern line."],"cap":"Page 1 · pattern"},{"t":"Make the little strawberry","items":["Double-fold the ends of the 6 cm strips and fix with a line of stitching.","Fold the strips in half lengthwise, right side out, and fix with a zigzag.","Fold 1 cm along the long side of the triangles.","Place triangle and strip at a lower corner of each body so they match when you face the two fabrics."],"cap":"Page 1 · strawberry"},{"t":"Sew the bag","items":["Face the two fabrics, right sides together.","Sew sides and handles with a straight stitch and a zigzag.","Bind the handles in two passes: first from the wrong side, then from the right side.","Thread the cord through the strips with a safety pin and add the stopper."],"cap":"Page 2 · final assembly"}]},"de":{"title":"Erdbeer-Beutel / Wäschebeutel","materials":[["Beutelkörper","2 Teile · 65 × 55 cm"],["Erdbeerteil","1 Teil · 17 × 17 cm"],["Streifen","2 Streifen · 6 × 16 cm"],["Kordel","50 cm"],["Kordelstopper","1 Stück"]],"steps":[{"t":"Schnitt übertragen","items":["Lege die beiden Stoffe aufeinander.","Übertrage den Schnitt auf die linke Stoffseite.","Schneide beide Lagen entlang der Schnittlinie zu."],"cap":"Seite 1 · Schnitt"},{"t":"Die kleine Erdbeere nähen","items":["Die Enden der 6-cm-Streifen doppelt einschlagen und mit einer Naht fixieren.","Die Streifen der Länge nach falten, rechte Seite aussen, und mit Zickzack fixieren.","An der langen Seite der Dreiecke 1 cm einschlagen.","Dreieck und Streifen an eine untere Ecke jedes Körpers setzen, so dass sie beim Aufeinanderlegen zusammenpassen."],"cap":"Seite 1 · Erdbeere"},{"t":"Beutel nähen","items":["Die beiden Stoffe rechts auf rechts legen.","Seiten und Henkel mit Geradstich und Zickzack nähen.","Die Henkel in zwei Durchgängen einfassen: erst von links, dann von rechts.","Die Kordel mit einer Sicherheitsnadel durch die Streifen ziehen und den Stopper anbringen."],"cap":"Seite 2 · Endmontage"}]},"fr":{"title":"Sac fraise / sac à rechange","materials":[["Corps du sac","2 pièces · 65 × 55 cm"],["Pièce fraise","1 pièce · 17 × 17 cm"],["Bandes","2 bandes · 6 × 16 cm"],["Cordelette","50 cm"],["Stop-cordon","1"]],"steps":[{"t":"Décalquer le patron","items":["Superpose les deux tissus.","Décalque le patron sur l’envers du tissu.","Découpe les deux épaisseurs en suivant la ligne du patron."],"cap":"Page 1 · patron"},{"t":"Faire la petite fraise","items":["Fais un double repli aux extrémités des bandes de 6 cm et fixe-le d’une piqûre.","Plie les bandes en deux dans la longueur, endroit dehors, et fixe au zigzag.","Fais un repli de 1 cm sur le grand côté des triangles.","Place triangle et bande à un coin inférieur de chaque corps, en vérifiant qu’ils coïncident quand tu superposes les tissus."],"cap":"Page 1 · fraise"},{"t":"Coudre le sac","items":["Superpose les deux tissus endroit contre endroit.","Couds les côtés et les anses au point droit puis au zigzag.","Pose le biais autour des anses en deux temps : d’abord sur l’envers, puis sur l’endroit.","Passe la cordelette dans les bandes avec une épingle à nourrice et ajoute le stop-cordon."],"cap":"Page 2 · montage final"}]},"it":{"title":"Borsa fragola / sacca per il cambio","materials":[["Corpo della borsa","2 pezzi · 65 × 55 cm"],["Pezzo fragola","1 pezzo · 17 × 17 cm"],["Strisce","2 strisce · 6 × 16 cm"],["Cordoncino","50 cm"],["Fermacorda","1"]],"steps":[{"t":"Ricalchiamo il cartamodello","items":["Affronta i due tessuti.","Ricalca il cartamodello sul rovescio del tessuto.","Taglia i due strati seguendo la linea del cartamodello."],"cap":"Pagina 1 · cartamodello"},{"t":"Facciamo la fragolina","items":["Fai una doppia piega alle estremità delle strisce da 6 cm e fissala con un’impuntura.","Piega le strisce a metà per il lungo, dritto all’esterno, e fissa con zigzag.","Fai una piega di 1 cm sul lato lungo dei triangoli.","Posiziona triangolo e striscia in un angolo inferiore di ogni corpo, controllando che combacino quando affronti i tessuti."],"cap":"Pagina 1 · fragolina"},{"t":"Cuciamo la borsa","items":["Affronta i due tessuti, dritto contro dritto.","Cuci lati e manici con punto dritto e zigzag.","Applica lo sbieco intorno ai manici in due passaggi: prima dal rovescio, poi dal dritto.","Infila il cordoncino nelle strisce con una spilla da balia e aggiungi il fermacorda."],"cap":"Pagina 2 · montaggio finale"}]}}},"toiletry":{"badge":"KIT 02","hours":3,"imgs":[null,1,2,3,4,5],"L":{"ca":{"title":"Necesser amb volant","intro":"Una guia visual perquè puguis seguir el projecte pas a pas sense perdre’t. Cada bloc t’indica què has de preparar, què has de cosir i com ha de quedar abans de continuar.","pills":["± 3 h","Cremallera · 45 cm","Acolxat + folre","Butxaca interior"],"materials":[["Volant","2 tires · 70 × 11 cm"],["Exterior","2 peces · 31 × 40 cm"],["Folre interior","2 peces · 31 × 40 cm"],["Butxaca","2 peces · 30 × 12 cm"],["Estabilitzador / foam","2 peces · 31 × 40 cm"],["Cremallera","1 unitat · 45 cm"]],"steps":[{"e":"Exterior","t":"Acolxem la tela exterior","items":[["Col·loca","Posa cada peça exterior sobre una peça de foam o estabilitzador."],["Marca","Dibuixa línies verticals cada 5 cm amb un bolígraf de planxa."],["Cus","Cus exactament sobre cada línia perquè tela i estabilitzador quedin units."]],"check":"Has de tenir dues peces exteriors acolxades abans de passar al volant."},{"e":"Volant","t":"Fem el farbalà","items":[["Doblega i planxa","Doblega cada tira de 70 × 11 cm per la meitat, al llarg."],["Prepara la màquina","Posa fil de goma a la canilla. Llargada de puntada: 4. Tensió: 0."],["Arruga","Cus un repunt recte pel costat obert, sense atacar. La tela s’anirà arrugant fins a formar el volant."],["Fixa","Col·loca el volant a la part superior de cada peça acolxada i fixa’l amb un zig-zag."]],"tip":"Repeteix aquest procés a les dues peces exteriors.","cap":"Referència · volant"},{"e":"Folre","t":"Cosim la butxaca","items":[["Enfronta","Posa les dues peces de butxaca cara bonica amb cara bonica."],["Cus","Cus els dos costats llargs a mida de pota."],["Gira i planxa","Gira la peça per un lateral i planxa-la bé."],["Repunta","Fes un repunt a la part superior de la butxaca."],["Col·loca","Centra-la sobre una de les peces de folre i cus només la part inferior."]],"cap":"Referència · butxaca"},{"e":"Muntatge","t":"Muntem la cremallera","items":[["Fes el “sandvitx”","Exterior amb volant + cremallera encarada al volant + folre encarat a l’exterior."],["Fixa","Alinia les tres capes a la part superior i subjecta-les amb agulles."],["Cus","Utilitza la pota de cremallera i cus la part superior del conjunt."],["Gira i repunta","Obre les teles cap a fora, estira-les bé i fes un repunt de càrrega per sota del volant."],["Repeteix","Fes exactament el mateix a l’altre costat de la cremallera."]],"warn":"El repunt ha de tapar els fils que han fixat el volant a la tela exterior. Si encara es veuen, entra una mica més el repunt.","cap":"Referència · cremallera"},{"e":"Tancament","t":"Tanquem el necesser","items":[["Enfronta","Posa juntes les dues cares exteriors i, per separat, les dues cares interiors, sempre cara bonica amb cara bonica."],["Cus els laterals llargs","Fes un repunt recte i un zig-zag als costats llargs."],["Gira","Gira el necesser perquè el folre quedi a l’exterior."],["Centra la cremallera","Col·loca la cremallera al centre i cus els dos extrems curts."],["Acaba els extrems","Utilitza les tires de 4,5 cm com a biaix: cus a 1 cm, fes doble plec i tanca per la part posterior."]],"cap":"Referència · tancament"},{"e":"Volum","t":"Li donem forma","items":[["Forma les cantonades","Triangula les quatre cantonades."],["Mesura","Marca una línia d’11 cm d’amplada, que correspon a 5,5 cm d’alçada."],["Cus","Cus directament sobre la línia marcada."],["Retalla","Retalla el sobrant deixant 1 cm de marge."],["Acaba","Torna a utilitzar les tires de 4,5 cm com a biaix perquè els costats quedin ben nets."]],"warn":"Abans de cosir, comprova que les teles, especialment el folre, estiguin ben planes i sense plecs. Obrir la cremallera et pot ajudar.","cap":"Referència · cantonades"}],"outro":"Necesser acabat. Guarda aquestes instruccions amb el teu kit i revisa el “check” del pas anterior si algun pas et genera dubtes."},"es":{"title":"Neceser con volante","intro":"Una guía visual para seguir el proyecto paso a paso sin perderte. Cada bloque te indica qué preparar, qué coser y cómo debe quedar antes de continuar.","pills":["± 3 h","Cremallera · 45 cm","Acolchado + forro","Bolsillo interior"],"materials":[["Volante","2 tiras · 70 × 11 cm"],["Exterior","2 piezas · 31 × 40 cm"],["Forro interior","2 piezas · 31 × 40 cm"],["Bolsillo","2 piezas · 30 × 12 cm"],["Estabilizador / foam","2 piezas · 31 × 40 cm"],["Cremallera","1 unidad · 45 cm"]],"steps":[{"e":"Exterior","t":"Acolchamos la tela exterior","items":[["Coloca","Pon cada pieza exterior sobre una pieza de foam o estabilizador."],["Marca","Dibuja líneas verticales cada 5 cm con un bolígrafo de plancha."],["Cose","Cose exactamente sobre cada línea para unir tela y estabilizador."]],"check":"Debes tener dos piezas exteriores acolchadas antes de pasar al volante."},{"e":"Volante","t":"Hacemos el volante","items":[["Dobla y plancha","Dobla cada tira de 70 × 11 cm por la mitad, a lo largo."],["Prepara la máquina","Pon hilo elástico en la canilla. Largo de puntada: 4. Tensión: 0."],["Frunce","Cose un pespunte recto por el lado abierto, sin rematar. La tela se irá frunciendo hasta formar el volante."],["Fija","Coloca el volante en la parte superior de cada pieza acolchada y fíjalo con un zigzag."]],"tip":"Repite este proceso en las dos piezas exteriores.","cap":"Referencia · volante"},{"e":"Forro","t":"Cosemos el bolsillo","items":[["Enfrenta","Pon las dos piezas de bolsillo derecho con derecho."],["Cose","Cose los dos lados largos a medida de prensatelas."],["Gira y plancha","Gira la pieza por un lateral y plánchala bien."],["Pespuntea","Haz un pespunte en la parte superior del bolsillo."],["Coloca","Céntralo sobre una de las piezas de forro y cose solo la parte inferior."]],"cap":"Referencia · bolsillo"},{"e":"Montaje","t":"Montamos la cremallera","items":[["Haz el “sándwich”","Exterior con volante + cremallera encarada al volante + forro encarado al exterior."],["Fija","Alinea las tres capas por la parte superior y sujétalas con alfileres."],["Cose","Usa el prensatelas de cremallera y cose la parte superior del conjunto."],["Gira y pespuntea","Abre las telas hacia fuera, estíralas bien y haz un pespunte de carga por debajo del volante."],["Repite","Haz exactamente lo mismo al otro lado de la cremallera."]],"warn":"El pespunte debe tapar los hilos que fijaron el volante a la tela exterior. Si aún se ven, mete un poco más el pespunte.","cap":"Referencia · cremallera"},{"e":"Cierre","t":"Cerramos el neceser","items":[["Enfrenta","Junta las dos caras exteriores y, por separado, las dos interiores, siempre derecho con derecho."],["Cose los laterales largos","Haz un pespunte recto y un zigzag en los lados largos."],["Gira","Gira el neceser para que el forro quede por fuera."],["Centra la cremallera","Coloca la cremallera en el centro y cose los dos extremos cortos."],["Remata los extremos","Usa las tiras de 4,5 cm como bies: cose a 1 cm, haz doble pliegue y cierra por la parte trasera."]],"cap":"Referencia · cierre"},{"e":"Volumen","t":"Le damos forma","items":[["Forma las esquinas","Triangula las cuatro esquinas."],["Mide","Marca una línea de 11 cm de ancho, que corresponde a 5,5 cm de alto."],["Cose","Cose directamente sobre la línea marcada."],["Recorta","Recorta el sobrante dejando 1 cm de margen."],["Remata","Vuelve a usar las tiras de 4,5 cm como bies para que los lados queden limpios."]],"warn":"Antes de coser, comprueba que las telas, sobre todo el forro, estén bien planas y sin pliegues. Abrir la cremallera ayuda.","cap":"Referencia · esquinas"}],"outro":"Neceser terminado. Guarda estas instrucciones con tu kit y revisa el “check” del paso anterior si alguno te genera dudas."},"en":{"title":"Ruffle toiletry bag","intro":"A visual guide so you can follow the project step by step without getting lost. Each block tells you what to prepare, what to sew and what it should look like before you carry on.","pills":["± 3 h","Zip · 45 cm","Quilted + lined","Inner pocket"],"materials":[["Ruffle","2 strips · 70 × 11 cm"],["Outer","2 pieces · 31 × 40 cm"],["Lining","2 pieces · 31 × 40 cm"],["Pocket","2 pieces · 30 × 12 cm"],["Stabiliser / foam","2 pieces · 31 × 40 cm"],["Zip","1 · 45 cm"]],"steps":[{"e":"Outer","t":"Quilt the outer fabric","items":[["Place","Lay each outer piece on a piece of foam or stabiliser."],["Mark","Draw vertical lines every 5 cm with a heat-erasable pen."],["Sew","Sew exactly on each line so fabric and stabiliser are joined."]],"check":"You should have two quilted outer pieces before moving on to the ruffle."},{"e":"Ruffle","t":"Make the ruffle","items":[["Fold and press","Fold each 70 × 11 cm strip in half lengthwise."],["Set up the machine","Put elastic thread in the bobbin. Stitch length: 4. Tension: 0."],["Gather","Sew a straight line along the open edge, without backstitching. The fabric will gather itself into a ruffle."],["Attach","Place the ruffle along the top of each quilted piece and fix it with a zigzag."]],"tip":"Repeat this on both outer pieces.","cap":"Reference · ruffle"},{"e":"Lining","t":"Sew the pocket","items":[["Face","Put the two pocket pieces right sides together."],["Sew","Sew the two long sides at foot width."],["Turn and press","Turn the piece through one side and press it well."],["Topstitch","Topstitch the upper edge of the pocket."],["Place","Centre it on one lining piece and sew only the bottom edge."]],"cap":"Reference · pocket"},{"e":"Assembly","t":"Fit the zip","items":[["Make the “sandwich”","Outer with ruffle + zip facing the ruffle + lining facing the outer."],["Pin","Align the three layers along the top and pin them."],["Sew","Use the zipper foot and sew the top of the set."],["Turn and topstitch","Open the fabrics outwards, pull them flat and topstitch just below the ruffle."],["Repeat","Do exactly the same on the other side of the zip."]],"warn":"The topstitch must cover the threads that fixed the ruffle to the outer fabric. If they still show, move the topstitch in a little.","cap":"Reference · zip"},{"e":"Closing","t":"Close the bag","items":[["Face","Put the two outer sides together and, separately, the two lining sides, always right sides together."],["Sew the long sides","Sew a straight line and a zigzag along the long sides."],["Turn","Turn the bag so the lining is on the outside."],["Centre the zip","Place the zip in the middle and sew the two short ends."],["Finish the ends","Use the 4.5 cm strips as binding: sew at 1 cm, double fold and close on the back."]],"cap":"Reference · closing"},{"e":"Volume","t":"Give it shape","items":[["Form the corners","Box the four corners."],["Measure","Mark a line 11 cm wide, which gives 5.5 cm of height."],["Sew","Sew directly on the marked line."],["Trim","Trim the excess leaving a 1 cm allowance."],["Finish","Use the 4.5 cm strips again as binding so the sides are clean."]],"warn":"Before sewing, check that the fabrics, especially the lining, are flat and without folds. Opening the zip helps.","cap":"Reference · corners"}],"outro":"Toiletry bag done. Keep these instructions with your kit and go back to the previous “check” if a step raises doubts."},"de":{"title":"Necessaire mit Rüsche","intro":"Eine visuelle Anleitung, damit du das Projekt Schritt für Schritt nachvollziehen kannst. Jeder Block sagt dir, was du vorbereitest, was du nähst und wie es aussehen soll, bevor es weitergeht.","pills":["± 3 h","Reissverschluss · 45 cm","Gesteppt + gefüttert","Innentasche"],"materials":[["Rüsche","2 Streifen · 70 × 11 cm"],["Aussenstoff","2 Teile · 31 × 40 cm"],["Futter","2 Teile · 31 × 40 cm"],["Tasche","2 Teile · 30 × 12 cm"],["Stabilisator / Foam","2 Teile · 31 × 40 cm"],["Reissverschluss","1 Stück · 45 cm"]],"steps":[{"e":"Aussenstoff","t":"Aussenstoff steppen","items":[["Auflegen","Lege jedes Aussenteil auf ein Stück Foam oder Stabilisator."],["Anzeichnen","Zeichne mit einem Bügelstift alle 5 cm senkrechte Linien."],["Nähen","Nähe genau auf jeder Linie, damit Stoff und Stabilisator verbunden sind."]],"check":"Du brauchst zwei gesteppte Aussenteile, bevor es mit der Rüsche weitergeht."},{"e":"Rüsche","t":"Rüsche nähen","items":[["Falten und bügeln","Falte jeden Streifen von 70 × 11 cm der Länge nach zur Hälfte."],["Maschine einstellen","Gummifaden in die Spule. Stichlänge: 4. Fadenspannung: 0."],["Kräuseln","Nähe eine gerade Naht an der offenen Kante, ohne zu verriegeln. Der Stoff kräuselt sich zur Rüsche."],["Fixieren","Lege die Rüsche an die Oberkante jedes gesteppten Teils und fixiere sie mit Zickzack."]],"tip":"Wiederhole das an beiden Aussenteilen.","cap":"Referenz · Rüsche"},{"e":"Futter","t":"Tasche nähen","items":[["Aufeinanderlegen","Lege die beiden Taschenteile rechts auf rechts."],["Nähen","Nähe die beiden langen Seiten füsschenbreit."],["Wenden und bügeln","Wende das Teil durch eine Seite und bügle es gut."],["Absteppen","Steppe die Oberkante der Tasche ab."],["Platzieren","Zentriere sie auf einem Futterteil und nähe nur die Unterkante fest."]],"cap":"Referenz · Tasche"},{"e":"Montage","t":"Reissverschluss einsetzen","items":[["Das „Sandwich“ bauen","Aussenteil mit Rüsche + Reissverschluss zur Rüsche gewandt + Futter zum Aussenteil gewandt."],["Stecken","Richte die drei Lagen an der Oberkante aus und stecke sie."],["Nähen","Nähe mit dem Reissverschlussfuss die Oberkante des Pakets."],["Wenden und absteppen","Klappe die Stoffe nach aussen, ziehe sie glatt und steppe knapp unter der Rüsche ab."],["Wiederholen","Mache genau dasselbe auf der anderen Seite des Reissverschlusses."]],"warn":"Die Absteppnaht muss die Fäden verdecken, mit denen die Rüsche fixiert wurde. Sieht man sie noch, setze die Naht etwas weiter innen.","cap":"Referenz · Reissverschluss"},{"e":"Schliessen","t":"Necessaire schliessen","items":[["Aufeinanderlegen","Lege die beiden Aussenseiten aufeinander und getrennt davon die beiden Futterseiten, immer rechts auf rechts."],["Lange Seiten nähen","Nähe die langen Seiten mit Geradstich und Zickzack."],["Wenden","Wende das Necessaire, sodass das Futter aussen liegt."],["Reissverschluss zentrieren","Lege den Reissverschluss in die Mitte und nähe die beiden kurzen Enden."],["Enden versäubern","Nutze die 4,5-cm-Streifen als Einfassband: bei 1 cm nähen, doppelt falten und auf der Rückseite schliessen."]],"cap":"Referenz · Schliessen"},{"e":"Volumen","t":"Form geben","items":[["Ecken formen","Falte die vier Ecken zu Dreiecken."],["Messen","Zeichne eine 11 cm breite Linie an; das ergibt 5,5 cm Höhe."],["Nähen","Nähe direkt auf der angezeichneten Linie."],["Zurückschneiden","Schneide den Überstand auf 1 cm Nahtzugabe zurück."],["Versäubern","Nutze wieder die 4,5-cm-Streifen als Einfassband, damit die Seiten sauber sind."]],"warn":"Prüfe vor dem Nähen, dass die Stoffe, vor allem das Futter, glatt und ohne Falten liegen. Den Reissverschluss zu öffnen hilft.","cap":"Referenz · Ecken"}],"outro":"Necessaire fertig. Bewahre diese Anleitung beim Kit auf und schau beim „Check“ des vorherigen Schritts nach, wenn etwas unklar ist."},"fr":{"title":"Trousse à volant","intro":"Un guide visuel pour suivre le projet pas à pas sans te perdre. Chaque bloc t’indique quoi préparer, quoi coudre et à quoi ça doit ressembler avant de continuer.","pills":["± 3 h","Fermeture · 45 cm","Matelassé + doublé","Poche intérieure"],"materials":[["Volant","2 bandes · 70 × 11 cm"],["Extérieur","2 pièces · 31 × 40 cm"],["Doublure","2 pièces · 31 × 40 cm"],["Poche","2 pièces · 30 × 12 cm"],["Stabilisateur / mousse","2 pièces · 31 × 40 cm"],["Fermeture à glissière","1 · 45 cm"]],"steps":[{"e":"Extérieur","t":"Matelasser le tissu extérieur","items":[["Place","Pose chaque pièce extérieure sur une pièce de mousse ou de stabilisateur."],["Trace","Trace des lignes verticales tous les 5 cm au stylo effaçable à la chaleur."],["Couds","Couds exactement sur chaque ligne pour solidariser tissu et stabilisateur."]],"check":"Tu dois avoir deux pièces extérieures matelassées avant de passer au volant."},{"e":"Volant","t":"Faire le volant","items":[["Plie et repasse","Plie chaque bande de 70 × 11 cm en deux dans la longueur."],["Prépare la machine","Fil élastique dans la canette. Longueur de point : 4. Tension : 0."],["Fronce","Pique une ligne droite le long du bord ouvert, sans point d’arrêt. Le tissu se fronce tout seul en volant."],["Fixe","Place le volant en haut de chaque pièce matelassée et fixe-le au zigzag."]],"tip":"Répète l’opération sur les deux pièces extérieures.","cap":"Référence · volant"},{"e":"Doublure","t":"Coudre la poche","items":[["Superpose","Place les deux pièces de poche endroit contre endroit."],["Couds","Couds les deux grands côtés au bord du pied."],["Retourne et repasse","Retourne la pièce par un côté et repasse-la bien."],["Surpique","Surpique le haut de la poche."],["Place","Centre-la sur une pièce de doublure et ne couds que le bas."]],"cap":"Référence · poche"},{"e":"Montage","t":"Poser la fermeture","items":[["Fais le « sandwich »","Extérieur avec volant + fermeture face au volant + doublure face à l’extérieur."],["Épingle","Aligne les trois épaisseurs en haut et épingle."],["Couds","Utilise le pied fermeture et couds le haut de l’ensemble."],["Retourne et surpique","Ouvre les tissus vers l’extérieur, tends-les bien et surpique juste sous le volant."],["Répète","Fais exactement la même chose de l’autre côté de la fermeture."]],"warn":"La surpiqûre doit couvrir les fils qui ont fixé le volant au tissu extérieur. S’ils dépassent, rentre un peu la surpiqûre.","cap":"Référence · fermeture"},{"e":"Fermeture","t":"Fermer la trousse","items":[["Superpose","Assemble les deux faces extérieures et, séparément, les deux faces intérieures, toujours endroit contre endroit."],["Couds les grands côtés","Une ligne droite puis un zigzag sur les grands côtés."],["Retourne","Retourne la trousse pour que la doublure soit à l’extérieur."],["Centre la fermeture","Place la fermeture au centre et couds les deux petits côtés."],["Finis les extrémités","Utilise les bandes de 4,5 cm comme biais : couds à 1 cm, double pli et referme au dos."]],"cap":"Référence · fermeture"},{"e":"Volume","t":"Donner la forme","items":[["Forme les coins","Triangule les quatre coins."],["Mesure","Trace une ligne de 11 cm de large, soit 5,5 cm de hauteur."],["Couds","Couds directement sur la ligne tracée."],["Recoupe","Recoupe l’excédent en laissant 1 cm de marge."],["Finis","Réutilise les bandes de 4,5 cm comme biais pour des côtés bien nets."]],"warn":"Avant de coudre, vérifie que les tissus, surtout la doublure, sont bien à plat et sans plis. Ouvrir la fermeture aide.","cap":"Référence · coins"}],"outro":"Trousse terminée. Garde ces instructions avec ton kit et reviens au « check » de l’étape précédente en cas de doute."},"it":{"title":"Beauty case con balza","intro":"Una guida visiva per seguire il progetto passo dopo passo senza perderti. Ogni blocco ti dice cosa preparare, cosa cucire e come deve risultare prima di continuare.","pills":["± 3 h","Cerniera · 45 cm","Trapuntato + foderato","Tasca interna"],"materials":[["Balza","2 strisce · 70 × 11 cm"],["Esterno","2 pezzi · 31 × 40 cm"],["Fodera","2 pezzi · 31 × 40 cm"],["Tasca","2 pezzi · 30 × 12 cm"],["Stabilizzatore / foam","2 pezzi · 31 × 40 cm"],["Cerniera","1 · 45 cm"]],"steps":[{"e":"Esterno","t":"Trapuntiamo il tessuto esterno","items":[["Posiziona","Metti ogni pezzo esterno su un pezzo di foam o stabilizzatore."],["Segna","Traccia linee verticali ogni 5 cm con una penna cancellabile col ferro."],["Cuci","Cuci esattamente su ogni linea per unire tessuto e stabilizzatore."]],"check":"Devi avere due pezzi esterni trapuntati prima di passare alla balza."},{"e":"Balza","t":"Facciamo la balza","items":[["Piega e stira","Piega ogni striscia di 70 × 11 cm a metà per il lungo."],["Prepara la macchina","Filo elastico nella spolina. Lunghezza punto: 4. Tensione: 0."],["Arriccia","Cuci una linea dritta sul lato aperto, senza fermare. Il tessuto si arriccia da solo formando la balza."],["Fissa","Posiziona la balza sul bordo superiore di ogni pezzo trapuntato e fissala con uno zigzag."]],"tip":"Ripeti su entrambi i pezzi esterni.","cap":"Riferimento · balza"},{"e":"Fodera","t":"Cuciamo la tasca","items":[["Affronta","Metti i due pezzi della tasca dritto contro dritto."],["Cuci","Cuci i due lati lunghi a larghezza di piedino."],["Rivolta e stira","Rivolta il pezzo da un lato e stiralo bene."],["Impuntura","Fai un’impuntura sul bordo superiore della tasca."],["Posiziona","Centrala su un pezzo di fodera e cuci solo il bordo inferiore."]],"cap":"Riferimento · tasca"},{"e":"Montaggio","t":"Montiamo la cerniera","items":[["Fai il “sandwich”","Esterno con balza + cerniera rivolta verso la balza + fodera rivolta verso l’esterno."],["Fissa","Allinea i tre strati sul bordo superiore e fermali con gli spilli."],["Cuci","Usa il piedino per cerniere e cuci il bordo superiore dell’insieme."],["Rivolta e impuntura","Apri i tessuti verso l’esterno, tendili bene e fai un’impuntura appena sotto la balza."],["Ripeti","Fai esattamente lo stesso sull’altro lato della cerniera."]],"warn":"L’impuntura deve coprire i fili che hanno fissato la balza al tessuto esterno. Se si vedono ancora, sposta l’impuntura un po’ più dentro.","cap":"Riferimento · cerniera"},{"e":"Chiusura","t":"Chiudiamo il beauty case","items":[["Affronta","Unisci le due facce esterne e, separatamente, le due interne, sempre dritto contro dritto."],["Cuci i lati lunghi","Una cucitura dritta e uno zigzag sui lati lunghi."],["Rivolta","Rivolta il beauty case in modo che la fodera resti all’esterno."],["Centra la cerniera","Metti la cerniera al centro e cuci le due estremità corte."],["Rifinisci le estremità","Usa le strisce da 4,5 cm come sbieco: cuci a 1 cm, doppia piega e chiudi sul retro."]],"cap":"Riferimento · chiusura"},{"e":"Volume","t":"Diamo la forma","items":[["Forma gli angoli","Triangola i quattro angoli."],["Misura","Segna una linea larga 11 cm, che corrisponde a 5,5 cm di altezza."],["Cuci","Cuci direttamente sulla linea segnata."],["Rifila","Rifila l’eccesso lasciando 1 cm di margine."],["Rifinisci","Usa di nuovo le strisce da 4,5 cm come sbieco per lati puliti."]],"warn":"Prima di cucire, controlla che i tessuti, soprattutto la fodera, async function fetchJSON(path){
  if(location.protocol==="file:") throw new Error("file");
  const r=await fetch(path+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json();
}
async function loadData(opts={}){
  const D={};
  try{ [D.kits,D.sessions,D.settings]=await Promise.all([fetchJSON("data/kits.json"),fetchJSON("data/sessions.json"),fetchJSON("data/settings.json")]); D.live=true; }
  catch(e){ D.kits=__INLINE.kits; D.sessions=__INLINE.sessions; D.settings=__INLINE.settings; D.live=false; }
  if(opts.guide){ try{ D.guide=await fetchJSON("data/guides/"+opts.guide+".json"); }catch(e){ D.guide=(__INLINE.guides||{})[opts.guide]||null; } }

}

    pink:(id)=>`<pattern id="${id}" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#FBF3EE"/><circle cx="13" cy="13" r="5" fill="#EBAA9E"/><circle cx="13" cy="13" r="1.8" fill="#F4D478"/><circle cx="0" cy="0" r="2.2" fill="#91A58D"/><circle cx="26" cy="26" r="2.2" fill="#91A58D"/></pattern>`,
    yellow:(id)=>`<pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FBF3D9"/><rect width="10" height="1.2" y="4" fill="#E8B846" opacity=".5"/></pattern>`,
  };

const ICONS={
    case:{body:`<rect x="18" y="38" width="64" height="36" rx="11"/>`,lines:`<path d="M18 52h64" stroke-dasharray="3 3"/><circle cx="72" cy="46" r="2"/>`},
    hen:{body:`<path d="M28 70c-8-10-4-30 12-32 10-1 16 6 20 12l14 2-8 6c2 10-6 16-18 16H32z"/>`,lines:`<circle cx="46" cy="46" r="1.5" fill="#25271F"/><path d="M40 34c2-6 8-6 8 0M46 34c2-6 8-6 8 0"/><path d="M38 70l-2 8M52 70l2 8"/>`},

const iconSvg=(k)=>{const pid="pat-"+k.id, ic=ICONS[k.icon];
    return `<svg class="ph" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><defs>${PAT[k.accent](pid)}</defs><rect width="100" height="100" fill="url(#${pid})"/><ellipse cx="50" cy="86" rx="30" ry="5" fill="#25271F" opacity=".08"/><g transform="translate(0 4)" stroke="#25271F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g fill="${TONE[k.accent]}">${ic.body}</g><g fill="none">${ic.lines}</g></g><rect width="100" height="100" fill="transparent" filter="url(#grain)"/></svg>`;};
/* ===== Kit page: catalogue info is public, the step guide unlocks after a (simulated) purchase. ===== */
(async function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const LOCALE={de:"de-CH",en:"en-GB",fr:"fr-CH",it:"it-CH",ca:"ca-ES",es:"es-ES"};
  const STEPBG=["#F6DDD7","#F7E6A8","#DCE7D8","#DDE5EF","#F5E4DA","#E8E1F0"];
  let lang=DEFAULT_LANG;
  const t=(k,vars)=>{let s=(I18N[lang]&&I18N[lang][k])??I18N[DEFAULT_LANG][k]??k; if(vars) for(const v in vars) s=s.replace(`{${v}}`,vars[v]); return s;};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function detectLang(){try{const s=localStorage.getItem("stich-lang"); if(s&&LANGS.includes(s)) return s;}catch(e){} const nav=(navigator.languages||[navigator.language||""]).map(l=>l.slice(0,2).toLowerCase()); return nav.find(l=>LANGS.includes(l))||DEFAULT_LANG;}
  const id=new URLSearchParams(location.search).get("id");
  const __D=await loadData({guide:id}); applyData(__D);
  const kit=KITS.find(k=>k.id===id)||KITS[0];
  const guide=__D.guide;
  const dk=k=>k+"_"+((guide&&guide.defaults)||"default");
  const owned=()=>{try{return JSON.parse(localStorage.getItem("stich-owned")||"[]").includes(kit.id);}catch(e){return false;}};
  const setOwned=v=>{try{let a=JSON.parse(localStorage.getItem("stich-owned")||"[]"); a=a.filter(x=>x!==kit.id); if(v)a.push(kit.id); localStorage.setItem("stich-owned",JSON.stringify(a));}catch(e){}};
  const fmtDuration=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return mm?`${hh}${t("dur_h")} ${mm}${t("dur_min")}`:`${hh}${t("dur_h")}`;};
  const photo=()=>PHOTOS.includes("kits/"+kit.id)?`<img class="real" src="img/kits/${kit.id}.jpg" alt="">`:"";
  const mailto=()=>`mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(t("mail_subject"))}&body=${encodeURIComponent(t("mail_body").replace(/(Projekt|Project|Projet|Progetto|Projecte|Proyecto)(\s?):\s?/,`$1$2: ${kit.name[lang]}`))}`;

  function render(){
    const f=FORMATS[kit.format], G=guide&&guide.L[lang], has=!!guide, isOwned=owned();
    const materials=has?`<section class="kit__mats"><p class="eyebrow eyebrow--dash" data-i18n="kit_in">${t("kit_in")}</p><div class="mats">${G.materials.map((m,i)=>`<div class="mat"><span class="mat__sw" style="background:${STEPBG[i%STEPBG.length]}"></span><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div>`).join("")}</div></section>`:"";
    const lock=has?(isOwned?`<div class="kit__owned"><b>${t("kit_owned")}</b><span>${t("kit_owned_p")}</span><button class="link link--ink" type="button" id="reset">${t("kit_reset")}</button></div>`
      :`<div class="kit__lock"><div><p class="eyebrow">${t("kit_steps")}</p><h2>${t("kit_lock_t")}</h2><p>${t("kit_lock_p")}</p></div><div class="kit__buybox"><button class="btn" type="button" id="buy">${t("kit_buy",{p:KIT_PRICE})}</button><small>${t("kit_buy_note")}</small></div></div>`)
      :`<div class="kit__lock kit__lock--soon"><div><p class="eyebrow">${t("kit_steps")}</p><h2>${t("kit_soon")}</h2></div></div>`;
    const steps=(has&&isOwned)?`<section class="kit__guide" id="guide">
      <div class="sec-head"><h2 class="sec-title"><span>${t("kit_steps")}</span><span class="star">✳</span></h2><nav class="toc">${G.steps.map((s,i)=>`<a href="#pas${i+1}">${String(i+1).padStart(2,"0")}</a>`).join("")}</nav></div>
      ${guide.legend?`<div class="glegend"><span class="gl gl--sew">${t("legend_sew")}</span><span class="gl gl--cut">${t("legend_cut")}</span><span class="gl gl--fold">${t("legend_fold")}</span><span class="gl gl--face">${t("legend_face")}</span><p>${t("legend_note")}</p></div>`:""}
      <div class="steps-list">${G.steps.map((s,i)=>{const n=guide.imgs[i]; return `<article class="gstep reveal" id="pas${i+1}">
        <div class="gstep__copy"><div class="gstep__num" style="background:${STEPBG[i%STEPBG.length]}">${String(i+1).padStart(2,"0")}</div><p class="eyebrow">${esc(s.e||t("kit_step",{n:i+1}))}</p><h3>${esc(s.t)}</h3>
          <ol class="gsub">${s.items.map(it=>Array.isArray(it)?`<li><b>${esc(it[0])}</b>${esc(it[1])}</li>`:`<li>${esc(it)}</li>`).join("")}</ol>
          ${s.op?`<div class="gops"><span class="gop gop--sew">${t("op_sew_"+s.op[0])}</span><span class="gop gop--cut">${t("op_cut_"+s.op[1])}</span></div>`:""}
          ${s.tip?`<div class="gtip"><b>${t("kit_tip")}</b>${esc(s.tip)}</div>`:""}${s.warn?`<div class="gtip gtip--warn"><b>${t("kit_warn")}</b>${esc(s.warn)}</div>`:""}
          <div class="gcheck"><b>${t("kit_check")}</b>${esc(s.check||t(dk("kit_check")))}</div></div>
        <div class="gstep__visual">${n?`<img src="img/guides/${kit.id}/${n}.jpg" alt="${esc(s.cap||"")}" loading="lazy"><span class="gcap">${esc(s.cap||t("kit_ref"))}</span>`:`<div class="gstep__ph" style="background:${SOFT[kit.accent]}"><svg viewBox="0 0 420 300"><rect x="85" y="45" width="250" height="210" rx="10" fill="#D9A38C" opacity=".75"/><g stroke="#6E5A51" stroke-width="2" stroke-dasharray="7 7"><line x1="125" y1="55" x2="125" y2="245"/><line x1="165" y1="55" x2="165" y2="245"/><line x1="205" y1="55" x2="205" y2="245"/><line x1="245" y1="55" x2="245" y2="245"/><line x1="285" y1="55" x2="285" y2="245"/></g></svg></div>`}</div>
      </article>`;}).join("")}</div>
      ${guide.src?`<div class="kit__source"><b>${t("kit_source")}</b> ${esc(guide.src[0])} · <a href="${esc(guide.src[1])}" target="_blank" rel="noopener">${esc(guide.src[1].replace(/^https?:\/\//,"").split("/")[0])}</a><p>${t("kit_source_note")}</p></div>`:""}
      <div class="kit__made"><p class="eyebrow">${guide.badge}</p><h2>${t("kit_made")}</h2><p>${esc(G.outro||t(dk("kit_outro")))}</p></div>
    </section>`:"";
    $("#kit").innerHTML=`
      <section class="kit__hero wrap">
        <a class="link link--ink kit__back" href="index.html#workshops"><svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="transform:scaleX(-1)"><path d="M1 6h15M11 1l5 5-5 5"/></svg><span>${t("kit_back")}</span></a>
        <div class="kit__grid">
          <div class="kit__copy">
            <p class="eyebrow">${has?guide.badge:t("kit_eyebrow")} · ${t("kit_level",{n:kit.level})}</p>
            <h1>${esc(has?G.title:kit.name[lang])}</h1>
            <p class="lead">${esc(has?(G.intro||t(dk("kit_intro"))):kit.desc[lang])}</p>
            <div class="pills">${has&&G.pills&&G.pills.length?G.pills.map(p=>`<span class="pill">${esc(p)}</span>`).join(""):`<span class="pill">${t("kit_time",{h:has?guide.hours:f.hours})}</span><span class="pill">${t("level"+kit.level+"_t")}</span><span class="pill">${t(f.nameKey)} · ${fmtDuration(f.hours)}</span>`}</div>
            ${materials}
          </div>
          <div class="kit__photo accent-${kit.accent}"><div class="photo kit__img">${photo()}${iconSvg(kit)}</div><span class="card__lvl">${t("level"+kit.level)}</span></div>
        </div>
      </section>
      <section class="wrap">${lock}</section>
      <div class="wrap">${steps}</div>
      <section class="kit__book wrap"><div><p class="eyebrow">${t(f.nameKey)} · ${f.price} CHF</p><h2>${t("kit_book_t")}</h2><p class="lead">${t("kit_book_p")}</p></div><a class="btn btn--sage" href="${mailto()}">${t("kit_book")}</a></section>`;
    document.title=`STICH · ${has?G.title:kit.name[lang]}`;
    const b=$("#buy"); if(b) b.addEventListener("click",()=>{setOwned(true); render(); const g=$("#guide"); if(g) g.scrollIntoView({behavior:"smooth",block:"start"});});
    const r=$("#reset"); if(r) r.addEventListener("click",()=>{setOwned(false); render(); window.scrollTo({top:0,behavior:"smooth"});});
    $$(".reveal").forEach(el=>el.classList.add("is-in"));
  }
  function applyI18n(){document.documentElement.lang=lang; $$("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n)); $$("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.i18nAria))); $("#lang").value=lang; render();}
  const sel=$("#lang"); sel.innerHTML=LANGS.map(l=>`<option value="${l}">${l.toUpperCase()}</option>`).join("");
  sel.addEventListener("change",e=>{lang=e.target.value; try{localStorage.setItem("stich-lang",lang);}catch(e){} applyI18n();});
  const header=$(".header"); const onScroll=()=>header.classList.toggle("is-stuck",window.scrollY>10); onScroll(); addEventListener("scroll",onScroll,{passive:true});
  const burger=$("#burger"), nav=$("#nav"); burger.addEventListener("click",()=>{const o=nav.classList.toggle("is-open"); burger.classList.toggle("is-open",o); burger.setAttribute("aria-expanded",String(o)); document.body.style.overflow=o?"hidden":"";});
  $("#year").textContent=new Date().getFullYear();
  lang=detectLang(); applyI18n();
})();
</script>
