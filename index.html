<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STICH — Sewing workshops, Zürich</title>
<meta name="description" content="Nähworkshops mit vorbereiteten Kits in Zürich. Sechs Plätze, ein Samstag, du gehst mit etwas Fertigem nach Hause.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23CF6446%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-family=%27serif%27%3ES%3C/text%3E%3C/svg%3E">
<style>
/* ============ STICH Zürich — styles ============ */
:root{
  --cream:#F8F4EC; --warm:#FFFDF8; --ink:#25271F; --ink-2:#4A4C42; --ink-3:#7A7C70;
  --line:rgba(37,39,31,.12); --line-2:rgba(37,39,31,.22);
  --sage:#91A58D; --blue:#8FA5BD; --mustard:#E8B846; --coral:#CF6446; --pink:#EBAA9E; --yellow:#F4D478;
  --sage-soft:#D9E2D4; --blue-soft:#D6E0EA; --mustard-soft:#F5E3AE; --coral-soft:#F3CFC2; --pink-soft:#F6DDD6; --yellow-soft:#FBEFC4;
  --bg:var(--cream); --surface:var(--warm); --text:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3);
  --serif:"Instrument Serif","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --gutter:clamp(18px,4vw,64px);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1F1A; --surface:#262821; --text:#F1ECE2; --muted:#C9C3B6; --faint:#9A9587;
    --line:rgba(241,236,226,.14); --line-2:rgba(241,236,226,.26);
    --sage-soft:#3B4A39; --blue-soft:#37434F; --mustard-soft:#5A4A22; --coral-soft:#5C3327; --pink-soft:#5A3A34; --yellow-soft:#57491F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1F1A; --surface:#262821; --text:#F1ECE2; --muted:#C9C3B6; --faint:#9A9587;
  --line:rgba(241,236,226,.14); --line-2:rgba(241,236,226,.26);
  --sage-soft:#3B4A39; --blue-soft:#37434F; --mustard-soft:#5A4A22; --coral-soft:#5C3327; --pink-soft:#5A3A34; --yellow-soft:#57491F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html:focus-within{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(46px,6vw,96px);line-height:1;}
h2{font-size:clamp(34px,4vw,56px);line-height:1.05}
h3{font-size:clamp(24px,2.4vw,32px);line-height:1.15}
em.i{font-style:italic;color:var(--coral)}
p{margin:0 0 1em}
.wrap{width:min(100% - 2*var(--gutter),1320px);margin-inline:auto}
.section{padding-block:clamp(56px,9vw,116px)}
.section--tight{padding-block:clamp(40px,6vw,72px)}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:500}
.lead{font-size:clamp(17px,1.4vw,20px);color:var(--muted);max-width:56ch}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:4px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:5px;border:1px solid transparent;text-decoration:none;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:transform .35s var(--ease),background .3s,color .3s,border-color .3s;background:var(--coral);color:#fff}
.btn:hover{transform:translate(2px,-2px) rotate(-.5deg);background:#B9563A}
.btn--sage{background:var(--sage);color:#fff}.btn--sage:hover{background:#7C9178}
.btn--ghost{background:transparent;border-color:var(--line-2);color:var(--text)}.btn--ghost:hover{background:var(--surface)}
.btn--sm{padding:10px 16px;font-size:11.5px}
.link{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;text-decoration:none;color:var(--coral)}
.link svg{transition:transform .3s var(--ease)}.link:hover svg{transform:translateX(4px)}
.link--sage{color:#5F7A5A}.link--blue{color:#5A7594}.link--mustard{color:#9A7311}.link--pink{color:#B3675A}

/* ---- draft notice ---- */
.notice{background:var(--mustard-soft);color:var(--ink);font-size:13px;text-align:center;padding:8px var(--gutter);border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .notice{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice{color:var(--text)}}

/* ---- header ---- */
.header{position:sticky;top:0;z-index:50;border-bottom:1px solid transparent;transition:border-color .3s,padding .3s}
/* blur lives on a pseudo-element: a backdrop-filter on .header itself would become the containing block of the fixed mobile nav */
.header::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.header__in{display:flex;align-items:center;gap:24px;padding-block:22px;transition:padding .3s var(--ease)}
.header.is-stuck{border-bottom-color:var(--line)}
.header.is-stuck .header__in{padding-block:12px}
.logo{text-decoration:none;display:block;line-height:1}
.logo__mark{font-family:var(--serif);font-size:30px;letter-spacing:.32em;display:flex;align-items:baseline}
.logo__mark .colon{color:var(--coral);font-family:var(--sans);font-weight:600;font-size:22px;letter-spacing:0;transform:translateY(-2px)}
.logo__sub{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:500}
.nav{display:flex;gap:28px;margin-left:auto;align-items:center}
.nav a{text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:6px 0;border-bottom:2px solid transparent;transition:border-color .3s}
.nav a:hover,.nav a.is-active{border-bottom-color:var(--coral)}
.header__tools{display:flex;align-items:center;gap:14px}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line-2);border-radius:5px;padding:8px 30px 8px 12px;font:inherit;font-size:12px;letter-spacing:.12em;font-weight:600;color:var(--text);cursor:pointer}
.lang::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.theme{background:transparent;border:1px solid var(--line-2);border-radius:5px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.burger{display:none;background:transparent;border:1px solid var(--line-2);border-radius:5px;width:40px;height:36px;place-items:center;cursor:pointer}
.burger span{display:block;width:18px;height:1.5px;background:var(--text);margin:2.5px 0}
@media (max-width:1060px){
  .nav{position:fixed;inset:0;background:var(--bg);flex-direction:column;justify-content:center;gap:22px;transform:translateY(-100%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;z-index:40;margin:0}
  .nav.is-open{transform:none;visibility:visible;transition-delay:0s}
  .nav a{font-size:20px;letter-spacing:.1em;font-family:var(--serif);text-transform:none}
  .header__cta{display:none}
  .burger{display:grid;position:relative;z-index:45}
  .burger.is-open span:nth-child(1){transform:translateY(4px) rotate(45deg)}
  .burger.is-open span:nth-child(2){opacity:0}
  .burger.is-open span:nth-child(3){transform:translateY(-4px) rotate(-45deg)}
  .header__tools{margin-left:auto}
}

/* ---- hero ---- */
.hero{padding-block:clamp(36px,6vw,80px) clamp(40px,6vw,72px);position:relative}
.hero__grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.hero__copy{position:relative}
.hero .lead{margin-top:26px;margin-bottom:34px}
.hero__cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero__deco{position:absolute;left:0;bottom:-20px;color:var(--mustard)}
.hero__photo{position:relative}
.photo{aspect-ratio:4/5;background:var(--sage-soft);border-radius:90px 20px 80px 30px;overflow:hidden;position:relative;isolation:isolate}
.photo--hero{aspect-ratio:5/4}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;width:100%;height:100%;transition:transform .8s var(--ease)}
.badge-circle{position:absolute;top:-18px;right:-10px;width:150px;height:150px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;text-align:center;padding:20px;font-size:11.5px;letter-spacing:.06em;line-height:1.35;transform:rotate(6deg);box-shadow:0 10px 30px rgba(37,39,31,.12)}
.badge-circle b{display:block;font-weight:700;letter-spacing:.12em;font-size:11px;margin-bottom:4px}
.badge-circle::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(255,255,255,.75);border-radius:50%}
.facts{margin-top:clamp(36px,5vw,64px);display:grid;grid-template-columns:repeat(6,1fr);gap:18px;padding:22px 26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.fact{min-width:0}
.fact b{display:block;font-family:var(--serif);font-size:26px;line-height:1.05;margin-bottom:4px}
.fact span{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
@media (max-width:1000px){.facts{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .hero__grid{grid-template-columns:1fr}
  .badge-circle{width:124px;height:124px;font-size:10.5px;right:6px;top:-14px}
  .facts{grid-template-columns:repeat(2,1fr);padding:18px}
}

/* ---- wave divider / steps ---- */
.wave{display:block;width:100%;height:40px;color:var(--surface)}
.steps{background:var(--surface);padding-block:clamp(28px,4vw,52px)}
.steps__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative}
.step{display:flex;gap:16px;align-items:center;position:relative}
.step__icon{position:relative;width:78px;height:78px;flex:0 0 78px;display:grid;place-items:center}
.step__icon .blob{position:absolute;inset:6px;border-radius:52% 48% 60% 40%/50% 60% 40% 50%;transform:rotate(-8deg)}
.step__icon svg{position:relative;width:44px;height:44px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.step__num{font-family:var(--serif);font-size:20px;color:var(--muted);letter-spacing:.08em}
.step__label{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;line-height:1.35}
.step:not(:last-child)::after{content:"";position:absolute;right:-24px;top:50%;width:24px;border-top:2px dashed var(--line-2);opacity:.9}
@media (max-width:900px){.steps__grid{grid-template-columns:1fr 1fr;gap:20px 18px}.step:not(:last-child)::after{display:none}}
@media (max-width:420px){.step{gap:12px}.step__icon{width:66px;height:66px;flex-basis:66px}}

/* ---- section heads ---- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(24px,3vw,40px);flex-wrap:wrap}
.sec-head h2 .star{color:var(--coral);font-size:.7em;vertical-align:.25em;margin-left:6px;display:inline-block}

/* ---- formats ---- */
.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.format{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;position:relative;overflow:hidden;transition:transform .4s var(--ease)}
.format:hover{transform:translateY(-4px)}
.format::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;opacity:.9}
.format--short::before{background:var(--pink-soft)}.format--sat::before{background:var(--sage-soft)}.format--long::before{background:var(--blue-soft)}
.format .eyebrow{margin-bottom:8px}
.format__price{font-family:var(--serif);font-size:56px;line-height:1;margin:6px 0 4px;position:relative}
.format__price small{font-family:var(--sans);font-size:14px;letter-spacing:.1em;color:var(--muted);margin-left:6px}
.format__meta{color:var(--muted);font-size:14px;margin-bottom:16px;position:relative}
.format ul{list-style:none;padding:0;margin:0 0 18px;font-size:14.5px;position:relative}
.format li{padding:6px 0 6px 22px;position:relative;border-top:1px dashed var(--line)}
.format li::before{content:"";position:absolute;left:2px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.format--sat li::before{background:var(--sage)}.format--long li::before{background:var(--blue)}
.format__tag{position:absolute;top:18px;right:18px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;background:var(--sage);color:#fff;padding:5px 9px;border-radius:4px}
.format__incl{font-size:13px;color:var(--faint);margin-top:14px}
@media (max-width:900px){.formats{grid-template-columns:1fr}}

/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;margin-bottom:28px}
.filters__group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters__label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:6px;font-weight:600}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}}
.filters__count{margin-left:auto;font-size:13px;color:var(--faint)}

/* ---- kit cards ---- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:800px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}
@media (max-width:520px){
  .grid{display:flex;overflow-x:auto;gap:14px;scroll-snap-type:x mandatory;padding-bottom:12px;margin-inline:calc(-1*var(--gutter));padding-inline:var(--gutter);scrollbar-width:thin}
  .grid>*{flex:0 0 78%;scroll-snap-align:start}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .45s var(--ease),border-color .3s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--line-2)}
.card__img{aspect-ratio:4/5;position:relative;overflow:hidden}
.card__img .ph{width:100%;height:100%;transition:transform .8s var(--ease)}
.card:hover .card__img .ph{transform:scale(1.03)}
.card__lvl{position:absolute;top:12px;left:12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 9px;border-radius:4px;background:var(--surface);color:var(--text);border:1px solid var(--line)}
.card__body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card__title{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.card__desc{font-size:14px;color:var(--muted);margin:0;flex:1}
.card__meta{display:flex;gap:16px;font-size:13.5px;color:var(--muted);align-items:center}
.card__meta span{display:inline-flex;align-items:center;gap:6px}
.card__meta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card__date{font-size:13px;padding:9px 12px;border-radius:6px;display:flex;align-items:center;gap:8px;font-weight:500}
.card__date svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.card__date--none{background:var(--bg);color:var(--faint);border:1px dashed var(--line-2)}
.card__cta{margin-top:4px}
.card[hidden]{display:none}
.card svg.ph{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.accent-coral .card__date{background:var(--coral-soft)}
.accent-sage .card__date{background:var(--sage-soft)}
.accent-mustard .card__date{background:var(--mustard-soft)}
.accent-blue .card__date{background:var(--blue-soft)}
.accent-pink .card__date{background:var(--pink-soft)}
.accent-yellow .card__date{background:var(--yellow-soft)}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:40px 0;font-family:var(--serif);font-size:24px}

/* ---- dates ---- */
.dates{display:flex;flex-direction:column;gap:12px}
.date{display:grid;grid-template-columns:150px 1.2fr 1.6fr auto;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;transition:transform .4s var(--ease)}
.date:hover{transform:translateX(4px)}
.date__day{font-family:var(--serif);font-size:34px;line-height:1}
.date__day small{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.date__fmt b{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.date__fmt span{font-size:13.5px;color:var(--muted)}
.date__kits{display:flex;flex-wrap:wrap;gap:6px}
.date__kits span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.date__seats{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:12.5px;color:var(--muted)}
.seats{display:flex;gap:4px}
.seats i{width:10px;height:10px;border-radius:50%;background:var(--sage);display:block}
.seats i.taken{background:var(--line-2)}
.date.is-full .seats i{background:var(--line-2)}
.date__prov{font-size:12.5px;color:var(--faint);margin-top:16px}
@media (max-width:900px){.date{grid-template-columns:1fr 1fr;gap:14px}.date__kits{grid-column:1/-1}.date__seats{align-items:flex-start;grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

/* ---- kits feature ---- */
.kitsec{background:var(--surface);border-block:1px solid var(--line)}
.kitsec__grid{display:grid;grid-template-columns:1.15fr 1fr .85fr;gap:clamp(24px,4vw,56px);align-items:center}
.kitsec__box{border-radius:20px 60px 20px 20px;overflow:hidden;aspect-ratio:1/1;background:var(--mustard-soft)}
.kitsec__copy h2{margin-bottom:18px}
.kitsec__copy ul{list-style:none;padding:0;margin:0 0 24px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:14px;color:var(--muted)}
.kitsec__copy li::before{content:"— ";color:var(--coral)}
.label-photo{position:relative;aspect-ratio:1;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;overflow:hidden}
.label-photo::after{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(37,39,31,.25);border-radius:50%}
.label{background:#F6F0E4;color:#25271F;padding:22px 26px;border:1px solid rgba(37,39,31,.15);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;line-height:1.7;transform:rotate(-4deg);box-shadow:0 12px 24px rgba(37,39,31,.08);width:min(70%,220px)}
.label b{display:block;letter-spacing:.32em;font-size:15px;font-family:var(--serif);font-weight:400;margin-bottom:8px}
.label .heart{color:#CF6446;margin-top:8px;display:block;text-align:right}
@media (max-width:1000px){.kitsec__grid{grid-template-columns:1fr 1fr}.label-photo{display:none}}
@media (max-width:700px){.kitsec__grid{grid-template-columns:1fr}.kitsec__copy ul{grid-template-columns:1fr}}

/* ---- space ---- */
.space{padding-block:clamp(56px,8vw,100px)}
.space__grid{display:grid;grid-template-columns:.9fr 1.6fr;gap:clamp(24px,4vw,56px);align-items:center}
.space__photo{aspect-ratio:16/9;border-radius:30px 30px 90px 30px;overflow:hidden;background:var(--blue-soft)}
.space__note{font-size:13.5px;color:var(--faint);margin-top:14px}
@media (max-width:800px){.space__grid{grid-template-columns:1fr}.space__photo{aspect-ratio:4/3}}

/* ---- FAQ ---- */
.faq{display:grid;grid-template-columns:1fr 1.5fr;gap:clamp(24px,5vw,80px);align-items:start}
.faq__list{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-family:var(--serif);font-size:clamp(20px,2vw,26px);line-height:1.2}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--sans);font-size:24px;color:var(--coral);flex:0 0 auto;transition:transform .35s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 40px 22px 0;margin:0;color:var(--muted);font-size:15.5px}
@media (max-width:800px){.faq{grid-template-columns:1fr}}

/* ---- contact ---- */
.contact{background:var(--ink);color:var(--cream);position:relative;overflow:hidden}
:root[data-theme="dark"] .contact{background:#15160f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact{background:#15160f}}
.contact .eyebrow{color:rgba(248,244,236,.6)}
.contact h2{max-width:22ch}
.contact__grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end;position:relative}
.contact__mail{font-family:var(--serif);font-size:clamp(26px,3.4vw,44px);color:var(--yellow);text-decoration:none;display:inline-block;border-bottom:1px solid rgba(244,212,120,.4);word-break:break-all}
.contact__mail:hover{border-bottom-color:var(--yellow)}
.contact p{color:rgba(248,244,236,.78);max-width:52ch}
.contact__side{display:flex;flex-direction:column;gap:14px;font-size:14.5px;color:rgba(248,244,236,.78)}
.contact__side b{color:var(--cream);display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.contact__deco{position:absolute;right:-30px;top:-40px;width:260px;color:rgba(248,244,236,.08)}
@media (max-width:800px){.contact__grid{grid-template-columns:1fr}}

/* ---- info bar ---- */
.info{border-top:1px solid var(--line);background:var(--surface)}
.info__grid{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;padding-block:32px}
.info__item{display:flex;gap:14px;align-items:flex-start}
.info__item svg{width:34px;height:34px;flex:0 0 34px;stroke:var(--text);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.info__item b{display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.info__item span{font-size:13px;color:var(--muted);line-height:1.45}
@media (max-width:1000px){.info__grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.info__grid{grid-template-columns:1fr 1fr}}

/* ---- footer ---- */
.footer{padding-block:28px;font-size:13px;color:var(--faint)}
.footer__in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.footer a{text-decoration:none}
.footer a:hover{color:var(--text)}

/* ---- decorative svgs ---- */
.deco{position:absolute;pointer-events:none}
.deco--stitch path{stroke-dasharray:6 5}

/* ---- reveal (page is visible at rest; JS hides only below-the-fold blocks until they scroll in) ---- */
.reveal{transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.pre{opacity:0;transform:translateY(15px)}
.reveal--d1{transition-delay:.08s}.reveal--d2{transition-delay:.16s}.reveal--d3{transition-delay:.24s}
.draw.pre path{stroke-dasharray:1;stroke-dashoffset:1}
.draw.is-in path{stroke-dasharray:1;animation:draw 1.4s var(--ease) forwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal.pre{opacity:1;transform:none}
  .draw.pre path{stroke-dashoffset:0}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

      if(el.classList.contains("is-in")||el.classList.contains("pre")) return;
      const r=el.getBoundingClientRect();
      if(reduce||!revObs||r.top<innerHeight+40){show(el);return;}   /* visible now: never hide it */
      el.classList.add("pre"); revObs.observe(el);
    });
  }
  observeReveal(document);
  /* belt and braces: anything still hidden that is on screen gets shown on scroll/resize */
  const sweep=()=>$$(".pre").forEach(el=>{const r=el.getBoundingClientRect(); if(r.top<innerHeight+40&&r.bottom>-40) show(el);});
  addEventListener("scroll",sweep,{passive:true}); addEventListener("resize",sweep); setTimeout(sweep,400);
  if(!reduce){const par=$$("[data-parallax] .ph"); const tick=()=>{const vh=innerHeight; par.forEach(p=>{const r=p.parentElement.getBoundingClientRect(); const c=(r.top+r.height/2-vh/2)/vh; p.style.transform=`translateY(${(-c*16).toFixed(1)}px) scale(1.08)`;});}; addEventListener("scroll",()=>requestAnimationFrame(tick),{passive:true}); tick();}

  /* --- init --- */
  const sel=$("#lang"); sel.innerHTML=LANGS.map(l=>`<option value="${l}">${l.toUpperCase()}</option>`).join("");
  sel.addEventListener("change",e=>setLang(e.target.value));
  $("#year").textContent=new Date().getFullYear();
  lang=detectLang(); applyI18n();
})();
</script>
</body></html>
